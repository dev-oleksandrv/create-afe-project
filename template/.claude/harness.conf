# Harness settings of this project: one KEY=value per line. Scripts read the values
# (scripts/lib/harness-conf.sh) and never run this file; an empty value leaves a setting unset.
# This file belongs to the project; a change to it is class gate.

# Environment commands, run by scripts/env.sh setup|fast|e2e|reset (check is scripts/check.sh):
# set up a working environment, a fast check, end-to-end tests, return to a known-good state.
# Once set to something other than scripts/check-docs.sh, CHECK_FAST also runs at each Stop of
# Claude Code that follows a change to a file other than Markdown (.claude/hooks/stop-dispatch.sh);
# Claude Code stops that hook after 600 seconds without blocking, so keep it well within that.
SETUP=
CHECK_FAST=scripts/check-docs.sh
E2E=
RESET=

# The check after every edit (.claude/hooks/post-edit-check.sh): a command that gets the changed
# file as its last argument and takes seconds, such as a formatter check and the linter on that
# file; and the files it applies to, as shell globs separated by spaces (empty: every file).
# Empty CHECK_EDIT: no check after edits.
CHECK_EDIT=
CHECK_EDIT_GLOBS=

# Ralph loop: the most failing checks in a row (scripts/check.sh, or the Stop hook's) before the
# agent stops and reports the failure.
RALPH_MAX_ITERATIONS=2

# The most review rounds for a change of class high before the open blockers go to the owner.
REVIEW_MAX_ROUNDS=2

# A warning, not a failure, when a pull request changes more lines than this, generated files
# left out. Empty: no warning.
DIFF_WARN_LINES=400

# Identifiers that requirements, criteria, and the specifications of checks define, as an
# extended regular expression. The "Acceptance and test plan" section and the tests carry them.
ID_PATTERN=(REQ|AC|INV)-[0-9]+

# Test files, as shell globs separated by spaces, for example `tests/* src/*_test.go`. Empty: the
# Acceptance check and the fail-without-change driver skip.
TEST_GLOBS=

# fail-without-change: the files besides the tests to copy onto the base, such as test helpers
# and runner configuration (shell globs), where SETUP then installs the dependencies; and the
# test command, which the driver runs with one test file as its last argument.
FWC_TOOLCHAIN_GLOBS=
FWC_TEST=
