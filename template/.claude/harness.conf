# Harness settings of this project (docs/contributing.md, section 3; docs/testing-rules.md,
# section 3): one KEY=value per line. Scripts read the values and never run this file; an empty
# value leaves a setting unset. This file belongs to the project; a change to it is class gate.

# Ralph loop: the most runs of scripts/check.sh before the agent stops and reports the failure.
RALPH_MAX_ITERATIONS=5

# Identifiers that requirements, criteria, and the specifications of checks define, as an
# extended regular expression. The "Acceptance and test plan" section and the tests carry them.
ID_PATTERN=(REQ|AC|INV)-[0-9]+

# Test files, as shell globs separated by spaces, for example `tests/* src/*_test.go`. Empty: the
# Acceptance check and the fail-without-change driver skip.
TEST_GLOBS=

# fail-without-change: the files besides the tests to copy onto the base, such as test helpers
# and runner configuration (shell globs); the command that installs dependencies there; the test
# command, which the driver runs with one test file as its last argument; and an optional
# command that receives the log file and the test file and exits 0 when the base failed for the
# expected reason.
FWC_TOOLCHAIN_GLOBS=
FWC_INSTALL=
FWC_TEST=
FWC_CLASSIFIER=
