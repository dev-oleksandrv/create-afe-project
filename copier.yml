# Project template for agent-friendly repositories. Maintainers: docs/maintaining.md.
_min_copier_version: "9.4"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# Seeded files: created once, owned by the project afterwards (docs/documentation-rules.md,
# section 9, in a generated project).
_skip_if_exists:
  - README.md
  - CLAUDE.md
  - .gitignore
  - docs/README.md
  - .claude/path-classes
  - .claude/harness.conf
  - .claude/settings.project.json

# Generated files: the Claude Code settings, the ownership manifest, and the decision index are
# rebuilt after every copy and update. Running them needs `copier copy --trust` and
# `copier update --trust`.
_tasks:
  - "scripts/gen-settings.sh"
  - "scripts/check-template.sh --write"
  - "scripts/gen-decisions-index.sh > docs/decisions/README.md"

# 0.5.0 replaces the seeded .claude/protected-paths, which the update deletes, with
# .claude/path-classes: its glob lines are kept as class approval.
_migrations:
  - version: v0.5.0
    when: "{{ _stage == 'before' }}"
    command: "[ ! -f .claude/protected-paths ] || cp .claude/protected-paths .claude/protected-paths.pre-0.5"
  - version: v0.5.0
    when: "{{ _stage == 'after' }}"
    command: "[ ! -f .claude/protected-paths.pre-0.5 ] || { grep -v -E '^[[:space:]]*(#|$)' .claude/protected-paths.pre-0.5 | sed 's/^/approval /' >> .claude/path-classes; rm .claude/protected-paths.pre-0.5; }"

project_name:
  type: str
  help: Project name, as written in prose (for example "acme")
  validator: "{% if not project_name.strip() %}Required{% endif %}"

project_description:
  type: str
  help: One sentence that says what the project is, ending with a period
  validator: "{% if not project_description.strip().endswith('.') %}End the sentence with a period{% endif %}"

github_repo:
  type: str
  help: GitHub repository as owner/name
  validator: "{% if not (github_repo | regex_search('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')) %}Use the form owner/name{% endif %}"

ci_runner:
  type: str
  help: Where CI jobs run by default; the repository variable CI_RUNS_ON overrides it
  choices:
    GitHub-hosted runner (ubuntu-latest): github-hosted
    Self-hosted Linux runner: self-hosted
  default: github-hosted

self_hosted_labels:
  type: str
  help: Labels of the self-hosted Linux runner, as a JSON array
  default: '["self-hosted"]'
  when: "{{ ci_runner == 'self-hosted' }}"
  validator: "{% if not (self_hosted_labels | regex_search('^\\[\\s*\"[A-Za-z0-9_.:-]+\"(\\s*,\\s*\"[A-Za-z0-9_.:-]+\")*\\s*\\]$')) %}Enter a JSON array of quoted labels, such as [\"self-hosted\", \"linux\"]{% endif %}"

docs_review:
  type: bool
  help: Review every pull request with Claude (needs the Claude GitHub App and the CLAUDE_CODE_OAUTH_TOKEN secret)
  default: true

code_review:
  type: bool
  help: Review pull requests that change code against the review rubric with Claude (needs the Claude GitHub App and the CLAUDE_CODE_OAUTH_TOKEN secret)
  default: true

dual_review:
  type: bool
  help: Review a branch before its pull request opens by the class of its paths, with the Codex CLI or a Claude subagent, and both in a Santa loop for class high (the loop needs the Codex CLI where Claude Code runs)
  default: false

acceptance_check:
  type: bool
  help: Check that every identifier of a pull request's Acceptance section appears in a test file (set TEST_GLOBS in .claude/harness.conf)
  default: false

fail_without_change:
  type: bool
  help: Check that each new or changed test fails on the base, with the project's own test command (set FWC_TEST in .claude/harness.conf)
  default: false

ci_runs_on_default:
  type: str
  default: "{% if ci_runner == 'self-hosted' %}{{ self_hosted_labels }}{% else %}[\"ubuntu-latest\"]{% endif %}"
  when: false

template_url:
  type: str
  default: https://github.com/xandronak/agent-docs-template
  when: false

_message_after_copy: |
  {{ project_name }} is ready. Next: make the initial commit on main (the one direct commit that
  docs/contributing.md allows), add the remote origin, push, run git remote set-head origin -a,
  set up the CI runner{% if docs_review or code_review %}, the
  CLAUDE_CODE_OAUTH_TOKEN secret, and the Claude GitHub App{% endif %}{% if dual_review %}, install
  and sign in to the Codex CLI{% endif %}, then run scripts/check.sh.
