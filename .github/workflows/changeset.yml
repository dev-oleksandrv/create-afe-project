# A pull request that changes what users of the package get (bin/, src/, template/, package.json)
# carries a changeset (docs/maintaining.md, section 2). The Version PR consumes the changesets, so
# it is the one pull request without one.
name: changeset

on:
  pull_request:

permissions:
  contents: read

jobs:
  changeset:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - run: npm ci

      - name: changeset present
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx changeset status --since "origin/$BASE_REF"
