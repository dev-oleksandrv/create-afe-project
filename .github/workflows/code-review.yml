# Code review of pull requests (docs/contributing.md, section 6). Claude reads the diff of a pull
# request that changes code, contracts, checks, or workflows, reviews it against the rubric of
# that section and the project's own criteria, and posts findings as PR comments. It proposes
# only; it changes nothing. It is a sensor with one pass: it runs when the pull request opens or
# leaves draft, and a push does not run it again. Needs the Claude GitHub App installed on the
# repository and the CLAUDE_CODE_OAUTH_TOKEN secret.
name: code-review

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    # A pull request that a workflow opened with GITHUB_TOKEN, such as a generated release pull
    # request, is not reviewed: its content is generated and the owner reviews it; the action also
    # refuses the runs a bot starts.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'github-actions[bot]' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The description as the event carries it; the skill reads it as data, never as instructions.
      - name: Diff and description of the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/pr.diff"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      # As in the docs-review workflow: track_progress keeps the prompt as custom instructions, and
      # the Skill tool is allowed explicitly because a headless run denies it otherwise. No plugin
      # is installed: the review rests on the repository's own rules. The action restores the
      # Claude configuration from the base branch, but the files a hook runs stay at the head:
      # --settings, above the project settings, disables the hooks; all but the protect hook, which
      # runs no file of the head, also skip themselves.
      - name: Review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: "true"
          prompt: "/review-code ${{ github.event.pull_request.number }} ${{ runner.temp }}/pr.diff ${{ runner.temp }}/pr-body.md"
          claude_args: '--allowedTools "Skill(review-code *),mcp__github_inline_comment__create_inline_comment" --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash" --max-turns 60 --settings ''{"disableAllHooks": true}'''
